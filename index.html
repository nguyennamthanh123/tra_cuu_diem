<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Điểm Thi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Cổng Tra Cứu Kết Quả</h1>
            <p class="text-slate-500 text-sm mt-1">Nhập thông tin thí sinh để xem điểm và xếp hạng</p>
        </div>

        <!-- Form nhập thông tin -->
        <form id="searchForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
                <input type="text" id="fullName" required placeholder="Ví dụ: Nguyễn Đức Mạnh" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Lớp</label>
                <input type="text" id="className" required placeholder="Ví dụ: 9A" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Ngày thi</label>
                <input type="text" id="examDate" placeholder="Ví dụ: 15/08/2026 (có thể để trống)" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md cursor-pointer">
                Tra Cứu Kết Quả
            </button>
        </form>

        <!-- Khung kết quả hiển thị sau khi tra cứu -->
        <div id="resultBox" class="mt-6 pt-5 border-t border-slate-200 hidden space-y-4">
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100 text-sm space-y-1.5">
                <p><span class="font-medium text-slate-600">Họ và tên:</span> <span id="resName" class="font-bold text-slate-900"></span></p>
                <p><span class="font-medium text-slate-600">Lớp:</span> <span id="resClass" class="text-slate-900"></span></p>
                <p><span class="font-medium text-slate-600">Ngày thi:</span> <span id="resDate" class="text-slate-900"></span></p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 text-center">
                    <span class="block text-xs text-amber-700 font-medium uppercase">Xếp hạng (STT)</span>
                    <span id="resSTT" class="text-2xl font-black text-amber-600">--</span>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-center">
                    <span class="block text-xs text-emerald-700 font-medium uppercase">Tổng Điểm</span>
                    <span id="resScore" class="text-2xl font-black text-emerald-600">--</span>
                </div>
            </div>

            <button type="button" onclick="resetForm()" class="w-full text-center text-xs text-slate-500 hover:text-slate-800 underline mt-2 block">
                ← Tra cứu thí sinh khác
            </button>
        </div>

        <!-- Thông báo lỗi nếu không tìm thấy -->
        <p id="errorMsg" class="mt-4 text-center text-sm text-red-500 hidden font-medium"></p>
    </div>

    <script>
        // ================= CẤU HÌNH GOOGLE SHEETS =================
        // Dán Sheet ID của bạn vào đây:
        const SHEET_ID = 'https://docs.google.com/spreadsheets/d/18mOtKAkRK71_fI96YwhlQhslJLHii-bAbwWA8BbmNNk/edit?gid=0#gid=0';
        
        // Tên tab chứa điểm (Mặc định thường là 'Sheet1' hoặc 'Trang tính1')
        const SHEET_NAME = 'Sheet1'; 
        // ==========================================================

        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',').map(item => item.replace(/^"|"$/g, '').trim());
                if (row.length >= 4) {
                    result.push({
                        name: row[0],
                        className: row[1],
                        examDate: row[2],
                        score: parseFloat(row[3].replace(',', '.')) || 0
                    });
                }
            }
            return result;
        }

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');
            const searchForm = document.getElementById('searchForm');

            const nameInput = document.getElementById('fullName').value.trim().toLowerCase();
            const classInput = document.getElementById('className').value.trim().toLowerCase();

            btn.textContent = 'Đang tra cứu...';
            btn.disabled = true;
            resultBox.classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                
                const csvData = await response.text();
                let allStudents = parseCSV(csvData);

                // Lọc riêng danh sách học sinh thuộc lớp được nhập
                let classStudents = allStudents.filter(item => item.className.toLowerCase() === classInput);

                if (classStudents.length === 0) {
                    // Nếu không lọc theo lớp được thì dùng toàn bộ danh sách
                    classStudents = allStudents;
                }

                // Tự động sắp xếp điểm từ CAO xuống THẤP
                classStudents.sort((a, b) => b.score - a.score);

                // Tìm vị trí học sinh
                const rankIndex = classStudents.findIndex(item => 
                    item.name.toLowerCase() === nameInput
                );

                if (rankIndex !== -1) {
                    const student = classStudents[rankIndex];
                    document.getElementById('resName').textContent = student.name;
                    document.getElementById('resClass').textContent = student.className;
                    document.getElementById('resDate').textContent = student.examDate;
                    
                    // Xếp hạng (Top 1 là điểm cao nhất)
                    document.getElementById('resSTT').textContent = `#${rankIndex + 1}`;
                    document.getElementById('resScore').textContent = student.score;

                    resultBox.classList.remove('hidden');
                    searchForm.classList.add('hidden');
                } else {
                    errorMsg.textContent = 'Không tìm thấy thông tin thí sinh. Vui lòng kiểm tra lại Họ tên và Lớp!';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Lỗi kết nối đến Google Sheets. Hãy đảm bảo bạn đã bật quyền xem "Bất kỳ ai có liên kết"!';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Tra Cứu Kết Quả';
                btn.disabled = false;
            }
        });

        function resetForm() {
            document.getElementById('searchForm').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('fullName').value = '';
        }
    </script>
</body>
</html>
