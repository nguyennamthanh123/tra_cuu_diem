<script>
        // ================= CẤU HÌNH DỮ LIỆU TẠI ĐÂY =================
        const SHEET_ID = 'https://docs.google.com/spreadsheets/d/18mOtKAkRK71_fI96YwhlQhslJLHii-bAbwWA8BbmNNk/edit?gid=0#gid=0';
        
        // Liệt kê chính xác tên các Tab (Sheet) bạn đã tạo ở dưới góc trái Google Sheet
        const SHEET_NAMES = ['9A']; 
        // ============================================================

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',').map(item => item.replace(/^"|"$/g, '').trim());
                if (row.length >= 4) {
                    result.push({
                        name: row[0],
                        className: row[1],
                        examDate: row[2],
                        score: parseFloat(row[3]) || 0
                    });
                }
            }
            return result;
        }

        async function fetchAllSheets() {
            let allData = [];
            for (const sheetName of SHEET_NAMES) {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const text = await res.text();
                        const rows = parseCSV(text);
                        allData = allData.concat(rows);
                    }
                } catch (e) {
                    console.warn(`Không đọc được tab: ${sheetName}`);
                }
            }
            return allData;
        }

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');

            const nameInput = document.getElementById('fullName').value.trim().toLowerCase();
            const classInput = document.getElementById('className').value.trim().toLowerCase();
            const dateInput = document.getElementById('examDate').value.trim();

            btn.textContent = 'Đang tra cứu từ tất cả các lớp...';
            btn.disabled = true;
            resultBox.classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                let data = await fetchAllSheets();

                if (data.length === 0) {
                    throw new Error('Không có dữ liệu');
                }

                // Sắp xếp thứ tự theo điểm từ CAO xuống THẤP
                data.sort((a, b) => b.score - a.score);

                // Tìm học sinh theo Tên và Lớp (không phân biệt chữ hoa/thường)
                const rankIndex = data.findIndex(item => 
                    item.name.toLowerCase() === nameInput && 
                    item.className.toLowerCase() === classInput
                );

                if (rankIndex !== -1) {
                    const student = data[rankIndex];
                    document.getElementById('resName').textContent = student.name;
                    document.getElementById('resClass').textContent = student.className;
                    document.getElementById('resDate').textContent = student.examDate;
                    
                    // Thứ hạng xếp theo toàn bộ dữ liệu gộp
                    document.getElementById('resSTT').textContent = `#${rankIndex + 1}`;
                    document.getElementById('resScore').textContent = student.score;

                    resultBox.classList.remove('hidden');
                } else {
                    errorMsg.textContent = 'Không tìm thấy kết quả khớp với Họ tên và Lớp đã nhập!';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Lỗi kết nối tới dữ liệu. Vui lòng kiểm tra quyền chia sẻ bảng tính hoặc Sheet ID!';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Tra Cứu Kết Quả';
                btn.disabled = false;
            }
        });
    </script>
