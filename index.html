<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu & Phân Tích Điểm Thi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-8 border border-slate-200 my-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Cổng Tra Cứu Kết Quả</h1>
            <p class="text-slate-500 text-sm mt-1">Xem điểm thi, xếp hạng & phân tích phổ điểm chi tiết</p>
        </div>

        <!-- Form tra cứu -->
        <form id="searchForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
                <input type="text" id="fullName" required placeholder="Ví dụ: Nguyễn Đức Mạnh" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Lớp</label>
                <input type="text" id="className" required placeholder="Ví dụ: 9A" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Ngày thi</label>
                <input type="text" id="examDate" placeholder="Ví dụ: 15/08/2026 (không bắt buộc)" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md cursor-pointer">
                Tra Cứu Kết Quả
            </button>
        </form>

        <!-- Khung kết quả hiển thị sau khi tra cứu -->
        <div id="resultBox" class="mt-6 pt-5 border-t border-slate-200 hidden space-y-5">
            <!-- Thông tin cá nhân -->
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100 text-sm space-y-1">
                <p><span class="font-medium text-slate-600">Họ và tên:</span> <span id="resName" class="font-bold text-slate-900"></span></p>
                <p><span class="font-medium text-slate-600">Lớp:</span> <span id="resClass" class="text-slate-900"></span></p>
                <p><span class="font-medium text-slate-600">Ngày thi:</span> <span id="resDate" class="text-slate-900"></span></p>
            </div>

            <!-- Ô xếp hạng & Điểm -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 text-center">
                    <span class="block text-xs text-amber-700 font-medium uppercase">Xếp hạng (STT)</span>
                    <span id="resSTT" class="text-2xl font-black text-amber-600">--</span>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-center">
                    <span class="block text-xs text-emerald-700 font-medium uppercase">Tổng Điểm</span>
                    <span id="resScore" class="text-2xl font-black text-emerald-600">--</span>
                </div>
            </div>

            <!-- Phân tích Top % & Vượt qua -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-blue-50 p-3.5 rounded-xl border border-blue-200 text-center">
                    <span class="block text-xs text-blue-700 font-semibold uppercase">Vị trí</span>
                    <span id="resTopPercent" class="text-xl font-bold text-blue-800 mt-0.5 block">--</span>
                </div>
                <div class="bg-purple-50 p-3.5 rounded-xl border border-purple-200 text-center">
                    <span class="block text-xs text-purple-700 font-semibold uppercase">Vượt qua</span>
                    <span id="resBeatPercent" class="text-xl font-bold text-purple-800 mt-0.5 block">--</span>
                </div>
            </div>

            <!-- Phổ điểm đồ thị cột chia 0.5 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <h3 class="text-xs font-bold uppercase text-slate-700 mb-1 text-center">Biểu Đồ Phổ Điểm Chi Tiết (Bước 0.5)</h3>
                <p class="text-[11px] text-center text-slate-500 mb-3">(Cột màu cam biểu thị khoảng điểm của bạn)</p>
                <div class="relative h-60 w-full overflow-x-auto">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <button type="button" onclick="resetForm()" class="w-full text-center text-xs text-slate-500 hover:text-slate-800 underline block pt-2">
                ← Tra cứu thí sinh khác
            </button>
        </div>

        <!-- Báo lỗi -->
        <p id="errorMsg" class="mt-4 text-center text-sm text-red-500 hidden font-medium"></p>
    </div>

    <script>
        const SHEET_ID = '18mOtKAkRK71_fI96YwhlQhslJLHii-bAbwWA8BbmNNk';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        let chartInstance = null;

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(item => item.replace(/^"|"$/g, '').trim());
                if (row.length >= 4) {
                    result.push({
                        name: row[0],
                        className: row[1],
                        examDate: row[2],
                        score: parseFloat(row[3].replace(',', '.')) || 0
                    });
                }
            }
            return result;
        }

        function renderChart(scores, studentScore) {
            // Tạo 20 khoảng điểm theo bước 0.5: [0 - 0.5], [0.5 - 1], ..., [9.5 - 10]
            const labels = [];
            const counts = new Array(20).fill(0);

            for (let i = 0; i < 20; i++) {
                const start = (i * 0.5).toFixed(1);
                const end = ((i + 1) * 0.5).toFixed(1);
                labels.push(`${start}-${end}`);
            }

            scores.forEach(score => {
                let bin = Math.floor(score / 0.5);
                if (bin >= 20) bin = 19; // Điểm 10 rơi vào bin cuối [9.5 - 10.0]
                if (bin < 0) bin = 0;
                counts[bin]++;
            });

            // Tìm bin của học sinh tra cứu
            let studentBin = Math.floor(studentScore / 0.5);
            if (studentBin >= 20) studentBin = 19;
            if (studentBin < 0) studentBin = 0;

            const bgColors = counts.map((_, idx) => idx === studentBin ? 'rgba(249, 115, 22, 0.9)' : 'rgba(99, 102, 241, 0.5)');
            const borderColors = counts.map((_, idx) => idx === studentBin ? '#ea580c' : '#6366f1');

            const ctx = document.getElementById('scoreChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Số lượng thí sinh',
                        data: counts,
                        backgroundColor: bgColors,
                        borderColor: borderColors,
                        borderWidth: 1.5,
                        borderRadius: 4,
                        barPercentage: 0.85
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return `Khoảng điểm: [${context[0].label}]`;
                                },
                                label: function(context) {
                                    let str = `Số lượng: ${context.parsed.y} bạn`;
                                    if (context.dataIndex === studentBin) {
                                        str += ' (Điểm của bạn ở đây)';
                                    }
                                    return str;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0, font: { size: 10 } },
                            grid: { color: '#f1f5f9' }
                        },
                        x: {
                            ticks: { 
                                font: { size: 9 },
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');
            const searchForm = document.getElementById('searchForm');

            const nameInput = document.getElementById('fullName').value.trim().toLowerCase();
            const classInput = document.getElementById('className').value.trim().toLowerCase();

            btn.textContent = 'Đang phân tích dữ liệu...';
            btn.disabled = true;
            resultBox.classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                
                const csvData = await response.text();
                let allStudents = parseCSV(csvData);

                // Lọc theo lớp
                let classStudents = allStudents.filter(item => item.className.toLowerCase() === classInput);
                if (classStudents.length === 0) {
                    classStudents = allStudents;
                }

                // Sắp xếp điểm từ cao xuống thấp
                classStudents.sort((a, b) => b.score - a.score);

                const totalStudents = classStudents.length;
                const rankIndex = classStudents.findIndex(item => item.name.toLowerCase() === nameInput);

                if (rankIndex !== -1) {
                    const student = classStudents[rankIndex];
                    const rank = rankIndex + 1;

                    // Tính Top % và % vượt qua
                    const topPercent = ((rank / totalStudents) * 100).toFixed(1);
                    const beatPercent = (((totalStudents - rank) / totalStudents) * 100).toFixed(1);

                    document.getElementById('resName').textContent = student.name;
                    document.getElementById('resClass').textContent = student.className;
                    document.getElementById('resDate').textContent = student.examDate || '15/08/2026';
                    document.getElementById('resSTT').textContent = `#${rank}/${totalStudents}`;
                    document.getElementById('resScore').textContent = student.score;

                    document.getElementById('resTopPercent').textContent = `Top ${topPercent}%`;
                    document.getElementById('resBeatPercent').textContent = `Hơn ${beatPercent}%`;

                    resultBox.classList.remove('hidden');
                    searchForm.classList.add('hidden');

                    // Vẽ biểu đồ phổ điểm 0.5
                    const allScores = classStudents.map(s => s.score);
                    renderChart(allScores, student.score);
                } else {
                    errorMsg.textContent = 'Không tìm thấy thông tin thí sinh khớp với thông tin đã nhập!';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Lỗi kết nối tới dữ liệu!';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Tra Cứu Kết Quả';
                btn.disabled = false;
            }
        });

        function resetForm() {
            document.getElementById('searchForm').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('fullName').value = '';
        }
    </script>
</body>
</html>
